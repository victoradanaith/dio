<title>Dio Daily Quiz</title>
<style>
:root{--bg:#f7f6f2;--card:#ffffff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e4e2db;--accent:#2f5d9a;--bad:#c2463c;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0f0f10;--card:#1e1e20;--ink:#ecebe6;--muted:#a09e97;--line:#38373a;--accent:#8db4ea;--bad:#e06a5f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;
  display:grid;place-items:center;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(340px,100%);display:grid;gap:12px}
h1{font-size:19px;margin:0}
p{margin:0;color:var(--muted);font-size:13px}
input{font:inherit;font-size:22px;letter-spacing:.35em;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;padding:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);min-height:1.3em}
</style>
</head>

</form>

const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function unlock(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(P.iv)}, key, u8(P.ct)));
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), code = document.getElementById("code"), go = document.getElementById("go"), err = document.getElementById("err");
f.addEventListener("submit", async e => {
  e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "กำลังเปิด…";
  try {
    const html = await unlock(code.value.trim());
    try { sessionStorage.setItem("ssis-p1-code", code.value.trim()); } catch {}
    show(html);
  } catch {
    err.textContent = "รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง"; code.select();
    go.disabled = false; go.textContent = "เปิด";
  }
});
// same tab, same session: no need to type it again after a reload
try { const s = sessionStorage.getItem("ssis-p1-code"); if (s) unlock(s).then(show, () => {}); } catch {}
