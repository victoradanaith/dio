const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function unlock(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(P.iv)}, key, u8(P.ct)));
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), code = document.getElementById("code"), go = document.getElementById("go"), err = document.getElementById("err");
f.addEventListener("submit", async e => {
  e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "กำลังเปิด…";
  try {
    const html = await unlock(code.value.trim());
    try { sessionStorage.setItem("ssis-p1-code", code.value.trim()); } catch {}
    show(html);
  } catch {
    err.textContent = "รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง"; code.select();
    go.disabled = false; go.textContent = "เปิด";
  }
});
// same tab, same session: no need to type it again after a reload
try { const s = sessionStorage.getItem("ssis-p1-code"); if (s) unlock(s).then(show, () => {}); } catch {}
